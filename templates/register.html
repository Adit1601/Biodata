<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account — Biodata Viewer</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:      #f5f5f7;
    --surface: #ffffff;
    --border:  #e0e0e0;
    --primary: #2563eb;
    --primary-h:#1d4ed8;
    --text:    #1a1a1a;
    --muted:   #6b7280;
    --error:   #dc2626;
    --radius:  12px;
    --shadow:  0 2px 8px rgba(0,0,0,0.08);
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    width: 100%;
    max-width: 400px;
    padding: 36px 32px;
  }

  .logo {
    text-align: center;
    margin-bottom: 28px;
  }
  .logo h1 {
    font-size: 1.4rem;
    font-weight: 700;
    color: var(--primary);
    letter-spacing: -0.4px;
  }
  .logo p {
    font-size: 0.85rem;
    color: var(--muted);
    margin-top: 4px;
  }

  .form-group {
    margin-bottom: 16px;
  }
  label {
    display: block;
    font-size: 0.82rem;
    font-weight: 500;
    color: var(--text);
    margin-bottom: 6px;
  }
  .hint {
    font-size: 0.75rem;
    color: var(--muted);
    margin-top: 4px;
  }
  input[type="text"],
  input[type="password"] {
    width: 100%;
    padding: 9px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 0.9rem;
    color: var(--text);
    background: var(--bg);
    transition: border-color 0.15s;
    outline: none;
  }
  input:focus { border-color: var(--primary); background: #fff; }

  .btn-submit {
    width: 100%;
    padding: 10px;
    background: var(--primary);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 0.92rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s;
    margin-top: 8px;
  }
  .btn-submit:hover { background: var(--primary-h); }

  .error-box {
    background: #fee2e2;
    border: 1px solid #fca5a5;
    color: var(--error);
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 0.83rem;
    margin-bottom: 18px;
  }

  .footer-link {
    text-align: center;
    margin-top: 20px;
    font-size: 0.82rem;
    color: var(--muted);
  }
  .footer-link a {
    color: var(--primary);
    text-decoration: none;
    font-weight: 500;
  }
  .footer-link a:hover { text-decoration: underline; }
</style>
</head>
<body>

<div class="card">
  <div class="logo">
    <h1>Biodata Viewer</h1>
    <p>Create your account</p>
  </div>

  {% if error %}
  <div class="error-box">{{ error }}</div>
  {% endif %}

  <form method="POST" action="/register">
    <div class="form-group">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" autocomplete="username"
             autocapitalize="none" autofocus required minlength="3"
             value="{{ request.form.get('username', '') }}">
      <div class="hint">At least 3 characters. This is how others will see your name.</div>
    </div>

    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" name="password"
             autocomplete="new-password" required minlength="8">
      <div class="hint">At least 8 characters.</div>
    </div>

    <div class="form-group">
      <label for="confirm">Confirm Password</label>
      <input type="password" id="confirm" name="confirm"
             autocomplete="new-password" required minlength="8">
    </div>

    <button class="btn-submit" type="submit">Create Account</button>
  </form>

  <div class="footer-link">
    Already have an account? <a href="/login">Sign in</a>
  </div>
</div>

</body>
</html>
