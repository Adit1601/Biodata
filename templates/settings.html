<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Settings — Biodata</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg:        #f5f5f7;
    --surface:   #ffffff;
    --border:    #e0e0e0;
    --primary:   #2563eb;
    --primary-h: #1d4ed8;
    --text:      #1a1a1a;
    --muted:     #6b7280;
    --radius:    12px;
    --shadow:    0 2px 8px rgba(0,0,0,0.08);
  }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

  /* ── HEADER ── */
  .header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 14px 24px;
    display: flex;
    align-items: center;
    gap: 14px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  }
  .back-btn {
    font-size: 0.82rem; color: var(--muted); text-decoration: none;
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 8px; padding: 6px 12px; white-space: nowrap;
  }
  .back-btn:hover { border-color: var(--primary); color: var(--primary); }
  .header h1 { font-size: 1.1rem; font-weight: 700; color: var(--text); }
  .header-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  .user-badge { font-size: 0.78rem; color: var(--muted); font-weight: 500; padding: 3px 8px; background: var(--bg); border: 1px solid var(--border); border-radius: 99px; }
  .settings-link { font-size: 0.78rem; color: var(--muted); text-decoration: none; padding: 3px 8px; border: 1px solid var(--border); border-radius: 99px; background: var(--bg); transition: color 0.12s; }
  .settings-link:hover { color: var(--primary); border-color: var(--primary); }
  .logout-link { font-size: 0.78rem; color: var(--muted); text-decoration: none; padding: 3px 8px; border: 1px solid var(--border); border-radius: 99px; background: var(--bg); transition: color 0.12s; }
  .logout-link:hover { color: #dc2626; border-color: #fca5a5; }

  /* ── PAGE ── */
  .page { max-width: 600px; margin: 32px auto; padding: 0 20px; }

  /* ── SECTION ── */
  .section { margin-bottom: 40px; }
  .section-title {
    font-size: 0.8rem; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.08em; color: var(--muted); margin-bottom: 14px;
  }

  /* ── LABELS LIST ── */
  .labels-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }

  .label-row {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 14px;
    display: flex;
    align-items: center;
    gap: 12px;
    box-shadow: var(--shadow);
  }

  /* view mode */
  .label-color-dot {
    width: 14px; height: 14px; border-radius: 50%;
    flex-shrink: 0; border: 2px solid rgba(0,0,0,0.08);
  }
  .label-name-text { flex: 1; font-size: 0.88rem; font-weight: 600; }
  .label-hex-text  { font-size: 0.72rem; color: var(--muted); font-family: monospace; }
  .label-row-actions { display: flex; gap: 6px; flex-shrink: 0; }

  .btn-edit {
    font-size: 0.76rem; padding: 5px 10px;
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 7px; cursor: pointer; color: var(--text);
    transition: border-color 0.12s;
  }
  .btn-edit:hover { border-color: var(--primary); color: var(--primary); }
  .btn-delete-label {
    font-size: 0.76rem; padding: 5px 10px;
    background: #fee2e2; border: 1px solid #fca5a5;
    border-radius: 7px; cursor: pointer; color: #dc2626;
    transition: background 0.12s;
  }
  .btn-delete-label:hover { background: #fecaca; }

  /* edit mode — replaces label row in-place */
  .label-edit-row {
    background: var(--surface);
    border: 2px solid var(--primary);
    border-radius: var(--radius);
    padding: 12px 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    box-shadow: var(--shadow);
  }
  .label-edit-row input[type="text"] {
    flex: 1; padding: 7px 10px;
    border: 1px solid var(--border); border-radius: 7px;
    font-size: 0.88rem; font-weight: 600;
    outline: none;
  }
  .label-edit-row input[type="text"]:focus { border-color: var(--primary); }

  /* ── COLOR PICKER ── */
  .color-picker-wrap { position: relative; }
  .color-preview-btn {
    width: 30px; height: 30px;
    border-radius: 50%; border: 2px solid rgba(0,0,0,0.15);
    cursor: pointer; flex-shrink: 0;
    transition: transform 0.12s;
  }
  .color-preview-btn:hover { transform: scale(1.1); }
  .color-picker-popup {
    display: none;
    position: absolute;
    top: calc(100% + 8px);
    left: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.14);
    z-index: 300;
    width: 220px;
  }
  .color-picker-popup.open { display: block; }
  .preset-colors {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 6px;
    margin-bottom: 10px;
  }
  .preset-swatch {
    width: 28px; height: 28px;
    border-radius: 50%; border: 2px solid transparent;
    cursor: pointer; transition: transform 0.1s, border-color 0.1s;
  }
  .preset-swatch:hover { transform: scale(1.15); }
  .preset-swatch.active { border-color: var(--text); }
  .hex-row {
    display: flex; align-items: center; gap: 6px;
  }
  .hex-input {
    flex: 1; padding: 5px 8px;
    border: 1px solid var(--border); border-radius: 6px;
    font-size: 0.8rem; font-family: monospace;
    outline: none;
  }
  .hex-input:focus { border-color: var(--primary); }
  .native-color-input {
    width: 28px; height: 28px;
    border: none; border-radius: 50%; cursor: pointer;
    padding: 0; background: none;
  }

  .edit-save-btn {
    font-size: 0.8rem; font-weight: 700; padding: 7px 14px;
    background: var(--primary); color: #fff;
    border: none; border-radius: 7px; cursor: pointer;
    transition: background 0.12s;
  }
  .edit-save-btn:hover { background: var(--primary-h); }
  .edit-cancel-btn {
    font-size: 0.8rem; padding: 7px 10px;
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 7px; cursor: pointer; color: var(--muted);
  }

  /* ── ADD LABEL FORM ── */
  .add-label-form {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    box-shadow: var(--shadow);
  }
  .add-label-form input[type="text"] {
    flex: 1; padding: 7px 10px;
    border: 1px solid var(--border); border-radius: 7px;
    font-size: 0.88rem; outline: none;
  }
  .add-label-form input[type="text"]:focus { border-color: var(--primary); }
  .btn-add-label-submit {
    font-size: 0.82rem; font-weight: 700; padding: 8px 16px;
    background: var(--primary); color: #fff;
    border: none; border-radius: 7px; cursor: pointer;
    white-space: nowrap;
    transition: background 0.12s;
  }
  .btn-add-label-submit:hover { background: var(--primary-h); }

  .empty-labels {
    text-align: center; padding: 24px;
    color: var(--muted); font-size: 0.88rem;
  }

  /* ── TOAST ── */
  .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(20px); background: #1a1a1a; color: #fff; padding: 10px 20px; border-radius: 10px; font-size: 0.84rem; font-weight: 500; opacity: 0; transition: opacity 0.2s, transform 0.2s; z-index: 700; pointer-events: none; white-space: nowrap; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div class="header">
  <a class="back-btn" href="/">&#8592; Back</a>
  <h1>&#9881;&#65039; Settings</h1>
  <div class="header-right">
    {% if current_user.is_admin %}<a class="settings-link" href="/admin" style="color:#dc2626">&#9760; Admin</a>{% endif %}
    <a class="settings-link" href="/profile/me">&#128100; My Profile</a>
    <span class="user-badge">{{ current_user.username }}</span>
    <a class="logout-link" href="/logout">Sign out</a>
  </div>
</div>

<div class="page">
  <div class="section">
    <div class="section-title">Labels</div>

    <div class="labels-list" id="labels-list">
      {% if labels %}
        {% for lbl in labels %}
        <div class="label-row" id="lrow-{{ lbl.id }}" data-id="{{ lbl.id }}" data-name="{{ lbl.name }}" data-color="{{ lbl.color }}">
          <span class="label-color-dot" style="background:{{ lbl.color }}"></span>
          <span class="label-name-text">{{ lbl.name }}</span>
          <span class="label-hex-text">{{ lbl.color }}</span>
          <div class="label-row-actions">
            <button class="btn-edit" onclick="startEdit({{ lbl.id }})">Edit</button>
            <button class="btn-delete-label" onclick="deleteLabel({{ lbl.id }}, '{{ lbl.name }}')">&#10005;</button>
          </div>
        </div>
        {% endfor %}
      {% else %}
        <div class="empty-labels" id="empty-msg">No labels yet. Create your first one below.</div>
      {% endif %}
    </div>

    <!-- Add label form -->
    <div class="add-label-form" id="add-form">
      <div class="color-picker-wrap" id="add-picker-wrap">
        <button class="color-preview-btn" id="add-color-preview"
                style="background:#6b7280"
                onclick="toggleColorPicker(event,'add-picker-popup','add-color-preview','add-hex-input')"></button>
        <div class="color-picker-popup" id="add-picker-popup">
          <div class="preset-colors" id="add-presets"></div>
          <div class="hex-row">
            <input type="text" class="hex-input" id="add-hex-input" value="#6b7280"
                   oninput="onHexInput(event,'add-color-preview','add-picker-popup')">
            <input type="color" class="native-color-input" id="add-native-color" value="#6b7280"
                   oninput="onNativeColor(event,'add-color-preview','add-hex-input','add-picker-popup')">
          </div>
        </div>
      </div>
      <input type="text" id="add-name" placeholder="Label name…" maxlength="50"
             onkeydown="if(event.key==='Enter') submitAddLabel()">
      <button class="btn-add-label-submit" onclick="submitAddLabel()">+ Add Label</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ═══════════════════════════════════════════════════════════════════════════
// Preset colours
// ═══════════════════════════════════════════════════════════════════════════
const PRESETS = [
  '#ef4444','#f97316','#eab308','#22c55e',
  '#14b8a6','#3b82f6','#8b5cf6','#ec4899',
  '#6b7280','#1e40af','#15803d','#9f1239',
];

function buildPresets(containerId, previewBtnId, hexInputId) {
  const container = document.getElementById(containerId);
  container.innerHTML = PRESETS.map(c => `
    <div class="preset-swatch" style="background:${c}" title="${c}"
         onclick="pickPreset(event,'${c}','${previewBtnId}','${hexInputId}','${containerId}')"></div>
  `).join('');
}

function pickPreset(event, color, previewId, hexId, presetsId) {
  event.stopPropagation();
  document.getElementById(previewId).style.background = color;
  document.getElementById(hexId).value = color;
  // mark active
  document.querySelectorAll('#' + presetsId + ' .preset-swatch').forEach(s => {
    s.classList.toggle('active', s.style.background === hexToRgb(color) || s.title === color);
  });
  // close popup
  event.target.closest('.color-picker-popup').classList.remove('open');
}

function hexToRgb(hex) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return `rgb(${r}, ${g}, ${b})`;
}

function toggleColorPicker(event, popupId, previewId, hexInputId) {
  event.stopPropagation();
  const popup = document.getElementById(popupId);
  const wasOpen = popup.classList.contains('open');
  closeAllPickers();
  if (!wasOpen) popup.classList.add('open');
}

function closeAllPickers() {
  document.querySelectorAll('.color-picker-popup.open').forEach(p => p.classList.remove('open'));
}
document.addEventListener('click', closeAllPickers);

function onHexInput(event, previewId, popupId) {
  const val = event.target.value.trim();
  if (/^#[0-9a-fA-F]{6}$/.test(val)) {
    document.getElementById(previewId).style.background = val;
  }
}

function onNativeColor(event, previewId, hexInputId, popupId) {
  const color = event.target.value;
  document.getElementById(previewId).style.background = color;
  document.getElementById(hexInputId).value = color;
}

function getSelectedColor(previewBtnId) {
  const btn = document.getElementById(previewBtnId);
  const hex = document.getElementById(previewBtnId.replace('preview','hex-input') ||
              previewBtnId.replace('-preview','-hex-input')).value.trim();
  return /^#[0-9a-fA-F]{6}$/.test(hex) ? hex : '#6b7280';
}

// ═══════════════════════════════════════════════════════════════════════════
// Add label
// ═══════════════════════════════════════════════════════════════════════════
async function submitAddLabel() {
  const nameInput = document.getElementById('add-name');
  const name  = nameInput.value.trim();
  const color = document.getElementById('add-hex-input').value.trim();

  if (!name) { showToast('Please enter a label name'); nameInput.focus(); return; }
  const finalColor = /^#[0-9a-fA-F]{6}$/.test(color) ? color : '#6b7280';

  try {
    const res  = await fetch('/api/labels', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({name, color: finalColor}),
    });
    const data = await res.json();
    if (!res.ok) { showToast('Error: ' + (data.error || 'Unknown')); return; }

    // Add row to DOM
    appendLabelRow(data.id, data.name, data.color);
    nameInput.value = '';
    document.getElementById('add-color-preview').style.background = '#6b7280';
    document.getElementById('add-hex-input').value = '#6b7280';
    const empty = document.getElementById('empty-msg');
    if (empty) empty.remove();
    showToast('Label "' + data.name + '" created');
  } catch(err) { showToast('Network error'); }
}

function appendLabelRow(id, name, color) {
  const list = document.getElementById('labels-list');
  const row = document.createElement('div');
  row.className = 'label-row';
  row.id = 'lrow-' + id;
  row.dataset.id = id;
  row.dataset.name = name;
  row.dataset.color = color;
  row.innerHTML = `
    <span class="label-color-dot" style="background:${esc(color)}"></span>
    <span class="label-name-text">${esc(name)}</span>
    <span class="label-hex-text">${esc(color)}</span>
    <div class="label-row-actions">
      <button class="btn-edit" onclick="startEdit(${id})">Edit</button>
      <button class="btn-delete-label" onclick="deleteLabel(${id},'${esc(name)}')">&#10005;</button>
    </div>`;
  list.appendChild(row);
}

// ═══════════════════════════════════════════════════════════════════════════
// Edit label (inline)
// ═══════════════════════════════════════════════════════════════════════════
function startEdit(labelId) {
  const row = document.getElementById('lrow-' + labelId);
  if (!row) return;
  const currentName  = row.dataset.name;
  const currentColor = row.dataset.color;

  const pickerId   = 'ep-popup-' + labelId;
  const previewId  = 'ep-preview-' + labelId;
  const hexInputId = 'ep-hex-' + labelId;
  const presetsId  = 'ep-presets-' + labelId;
  const nativeId   = 'ep-native-' + labelId;

  const editRow = document.createElement('div');
  editRow.className = 'label-edit-row';
  editRow.id = 'ledit-' + labelId;
  editRow.dataset.origName  = currentName;
  editRow.dataset.origColor = currentColor;
  editRow.innerHTML = `
    <div class="color-picker-wrap">
      <button class="color-preview-btn" id="${previewId}"
              style="background:${esc(currentColor)}"
              onclick="toggleColorPicker(event,'${pickerId}','${previewId}','${hexInputId}')"></button>
      <div class="color-picker-popup" id="${pickerId}">
        <div class="preset-colors" id="${presetsId}"></div>
        <div class="hex-row">
          <input type="text" class="hex-input" id="${hexInputId}" value="${esc(currentColor)}"
                 oninput="onHexInput(event,'${previewId}','${pickerId}')">
          <input type="color" class="native-color-input" id="${nativeId}" value="${esc(currentColor)}"
                 oninput="onNativeColor(event,'${previewId}','${hexInputId}','${pickerId}')">
        </div>
      </div>
    </div>
    <input type="text" id="ename-${labelId}" value="${esc(currentName)}" maxlength="50"
           onkeydown="if(event.key==='Enter') saveEdit(${labelId}); if(event.key==='Escape') cancelEdit(${labelId})">
    <button class="edit-save-btn" onclick="saveEdit(${labelId})">Save</button>
    <button class="edit-cancel-btn" onclick="cancelEdit(${labelId})">Cancel</button>`;

  row.replaceWith(editRow);
  buildPresets(presetsId, previewId, hexInputId);
  document.getElementById('ename-' + labelId).focus();
}

async function saveEdit(labelId) {
  const nameInput = document.getElementById('ename-' + labelId);
  const hexInput  = document.getElementById('ep-hex-' + labelId);
  const name  = nameInput.value.trim();
  const color = hexInput.value.trim();
  if (!name) { showToast('Name cannot be empty'); nameInput.focus(); return; }
  const finalColor = /^#[0-9a-fA-F]{6}$/.test(color) ? color : '#6b7280';

  try {
    const res  = await fetch('/api/labels/' + labelId, {
      method: 'PUT',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({name, color: finalColor}),
    });
    const data = await res.json();
    if (!res.ok) { showToast('Error: ' + (data.error || 'Unknown')); return; }

    // Replace edit row with updated view row
    const editRow = document.getElementById('ledit-' + labelId);
    const newRow  = document.createElement('div');
    newRow.className = 'label-row';
    newRow.id = 'lrow-' + labelId;
    newRow.dataset.id = labelId;
    newRow.dataset.name = name;
    newRow.dataset.color = finalColor;
    newRow.innerHTML = `
      <span class="label-color-dot" style="background:${esc(finalColor)}"></span>
      <span class="label-name-text">${esc(name)}</span>
      <span class="label-hex-text">${esc(finalColor)}</span>
      <div class="label-row-actions">
        <button class="btn-edit" onclick="startEdit(${labelId})">Edit</button>
        <button class="btn-delete-label" onclick="deleteLabel(${labelId},'${esc(name)}')">&#10005;</button>
      </div>`;
    editRow.replaceWith(newRow);
    showToast('Label updated');
  } catch(err) { showToast('Network error'); }
}

function cancelEdit(labelId) {
  const editRow = document.getElementById('ledit-' + labelId);
  if (!editRow) return;
  // Restore original view row from data attributes embedded when startEdit was called
  const name  = editRow.dataset.origName;
  const color = editRow.dataset.origColor;
  const newRow = document.createElement('div');
  newRow.className = 'label-row';
  newRow.id = 'lrow-' + labelId;
  newRow.dataset.id    = labelId;
  newRow.dataset.name  = name;
  newRow.dataset.color = color;
  newRow.innerHTML = `
    <span class="label-color-dot" style="background:${esc(color)}"></span>
    <span class="label-name-text">${esc(name)}</span>
    <span class="label-hex-text">${esc(color)}</span>
    <div class="label-row-actions">
      <button class="btn-edit" onclick="startEdit(${labelId})">Edit</button>
      <button class="btn-delete-label" onclick="deleteLabel(${labelId},'${esc(name)}')">&#10005;</button>
    </div>`;
  editRow.replaceWith(newRow);
}

// ═══════════════════════════════════════════════════════════════════════════
// Delete label
// ═══════════════════════════════════════════════════════════════════════════
async function deleteLabel(labelId, name) {
  if (!confirm(`Delete label "${name}"? It will be removed from all candidates.`)) return;
  try {
    const res = await fetch('/api/labels/' + labelId, { method: 'DELETE' });
    if (!res.ok) { showToast('Error deleting label'); return; }
    const row = document.getElementById('lrow-' + labelId);
    if (row) row.remove();
    showToast(`Label "${name}" deleted`);
    if (!document.querySelector('.label-row')) {
      const list = document.getElementById('labels-list');
      const empty = document.createElement('div');
      empty.className = 'empty-labels'; empty.id = 'empty-msg';
      empty.textContent = 'No labels yet. Create your first one below.';
      list.appendChild(empty);
    }
  } catch(err) { showToast('Network error'); }
}

// ═══════════════════════════════════════════════════════════════════════════
// Toast
// ═══════════════════════════════════════════════════════════════════════════
let toastTimer = null;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2800);
}

function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

// Init: build add-form presets
buildPresets('add-presets', 'add-color-preview', 'add-hex-input');
</script>
</body>
</html>
